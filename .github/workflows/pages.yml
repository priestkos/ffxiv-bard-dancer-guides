name: Deploy sites to GitHub Pages

# Publishes the contents of ./sites as the Pages site root, so the landing page
# is served at / and the two guides sit beside it at /bard-guide.html and
# /dancer-guide.html. Actions-based Pages (build_type: workflow), which is the
# only way to publish a subfolder rather than the repo root or /docs.

on:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The three pages are self-contained (inline CSS/JS, no external assets),
      # so there is no build step — the sources are the artifact.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sites

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
